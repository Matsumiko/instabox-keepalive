name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/*.test.js
      - name: CLI refuses to run without a key
        run: |
          if node src/cli.js tick; then echo "expected a failure"; exit 1; fi
